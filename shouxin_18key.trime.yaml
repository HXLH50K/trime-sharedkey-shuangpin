  popup_height: 60
  popup_bottom_margin: 55
  popup_key_height: 45
  popup_text_size: 22

# ==================== 键盘基类定义（使用锚点） ====================
# 数字键盘基类
_number_base: &number_base
  author: "hxlh50k"
  name: "数字"
  width: 20
  height: 59

# ==================== 键盘预设 ====================
preset_keyboards:
  # ========== 中文18键 ==========
  default:
    name: "手心式18键"
    author: "hxlh50k"
    ascii_mode: 0
    ascii_keyboard: qwerty26 # 使用26键作为ASCII输入法。Not Work in Trime 3.3.8
    reset_ascii_mode: true
    width: 12.3
    height: 59
    lock: true
    keys:
      # 第1行：字母键 (长按与上滑统一) - 4单+3双=100%
      # 滑动发送大写字母作为精确输入标记
      - {click: key_Q, long_click: "#", popup: ["#", "q", "Q"], swipe_up: "#", width: 12.3}
      - {click: key_WE, long_click: "1", popup: ["1", "E", "W", "w", "e"], swipe_up: "1", swipe_left: W, swipe_right: E, width: 16.9}
      - {click: key_RT, long_click: "2", popup: ["2", "r", "T", "t", "R"], swipe_up: "2", swipe_left: R, swipe_right: T, width: 16.9}
      - {click: key_Y, long_click: "3", popup: ["3", "y", "Y"], swipe_up: "3", width: 12.3}
      - {click: key_U, long_click: "/", popup: ["/", "÷", "U", "u"], swipe_up: "/", width: 12.3}
      - {click: key_IO, long_click: "-", popup: ["-", "o", "i", "I", "O"], swipe_up: "-", swipe_left: I, swipe_right: O, width: 16.9}
      - {click: key_P, long_click: "_", popup: ["_", "p", "P"], swipe_up: "_", width: 12.3}
      # 第2行：字母键 (长按与上滑统一) - 左右各留空6.1%
      # 滑动发送大写字母作为精确输入标记
      - {width: 6.1}
      - {click: key_A, long_click: "!", popup: ["!", "a", "A"], swipe_up: "!", width: 12.3}
      - {click: key_SD, long_click: "4", popup: ["4", "D", "S", "s", "D"], swipe_up: "4", swipe_left: S, swipe_right: D, width: 16.9}
      - {click: key_FG, long_click: "5", popup: ["5", "f", "G", "g", "F"], swipe_up: "5", swipe_left: F, swipe_right: G, width: 16.9}
      - {click: key_H, long_click: "6", popup: ["6", "h", "H"], swipe_up: "6", width: 12.3}
      - {click: key_JK, long_click: "~", popup: ["~", "k", "j", "K", "J"], swipe_up: "~", swipe_left: J, swipe_right: K, width: 16.9}
      - {click: key_L, long_click: "?", popup: ["?", "l", "L"], swipe_up: "?", width: 12.3}
      - {width: 6.1}
      # 第3行：字母键+退格 (长按与上滑统一)
      # 滑动发送大写字母作为精确输入标记
      - {click: VoidSymbol, label: "㇕'", composing: key_auxiliary, swipe_up: key_fenci, width: 14.6, send_bindings: false}
      - {click: key_Z, long_click: "@", popup: ["@", "z", "Z"], swipe_up: "@", width: 12.3}
      - {click: key_XC, long_click: "7", popup: ["7", "x", "C", "c", "X"], swipe_up: "7", swipe_left: X, swipe_right: C, width: 16.9}
      - {click: key_V, long_click: "8", popup: ["8", "v", "V"], swipe_up: "8", width: 12.3}
      - {click: key_BN, long_click: "9", popup: ["9", "b", "N", "n", "B"], swipe_up: "9", swipe_left: B, swipe_right: N, width: 16.9}
      - {click: key_M, long_click: "0", popup: ["0", "m", "M"], swipe_up: "0", width: 12.3}
      - {click: key_backspace, swipe_up: key_control_backspace, swipe_down: key_control_z, width: 14.6}
      # 第4行：功能键
      - {click: to_symbol_liquid_keyboard, width: 15}
      - {click: to_number_keyboard, long_click: VoiceAssist, width: 12}
      - {click: key_comma_cn, long_click: ",", swipe_up: key_ascii_comma, width: 10}
      - {click: key_space, width: 26}
      - {click: key_period_cn, long_click: ".", swipe_up: key_ascii_period, width: 10}
      - {click: switch_cn_to_en, long_click: key_lang_switch, swipe_up: F4, swipe_right: PROG_RED, width: 12}
      - {click: key_return, width: 15}

  # ========== 英文26键 ==========
  qwerty26:
    name: "全键盘"
    author: "hxlh50k"
    ascii_mode: 1
    width: 10
    height: 59
    lock: true
    keys:
      # 第1行：q-p，使用click发送按键，ascii_mode=1时由ascii_composer处理直接上屏
      - {click: q, label: q, long_click: "1", popup: ["1", "q", "Q"], swipe_up: "1", swipe_down: Q}
      - {click: w, label: w, long_click: "2", popup: ["2", "w", "W"], swipe_up: "2", swipe_down: W}
      - {click: e, label: e, long_click: "3", popup: ["3", "e", "E"], swipe_up: "3", swipe_down: E}
      - {click: r, label: r, long_click: "4", popup: ["4", "r", "R"], swipe_up: "4", swipe_down: R}
      - {click: t, label: t, long_click: "5", popup: ["5", "t", "T"], swipe_up: "5", swipe_down: T}
      - {click: y, label: y, long_click: "6", popup: ["6", "y", "Y"], swipe_up: "6", swipe_down: Y}
      - {click: u, label: u, long_click: "7", popup: ["7", "u", "U"], swipe_up: "7", swipe_down: U}
      - {click: i, label: i, long_click: "8", popup: ["8", "i", "I"], swipe_up: "8", swipe_down: I}
      - {click: o, label: o, long_click: "9", popup: ["9", "o", "O"], swipe_up: "9", swipe_down: O}
      - {click: p, label: p, long_click: "0", popup: ["0", "p", "P"], swipe_up: "0", swipe_down: P}
      # 第2行：a-l，使用click发送按键
      - {width: 5}
      - {click: a, label: a, long_click: "~", popup: ["~", "a", "A"], swipe_up: "~", swipe_down: A}
      - {click: s, label: s, long_click: "!", popup: ["!", "s", "S"], swipe_up: "!", swipe_down: S}
      - {click: d, label: d, long_click: "@", popup: ["@", "d", "D"], swipe_up: "@", swipe_down: D}
      - {click: f, label: f, long_click: "#", popup: ["#", "f", "F"], swipe_up: "#", swipe_down: F}
      - {click: g, label: g, long_click: "%", popup: ["%", "g", "G"], swipe_up: "%", swipe_down: G}
      - {click: h, label: h, long_click: "&", popup: ["&", "h", "H"], swipe_up: "&", swipe_down: H}
      - {click: j, label: j, long_click: "*", popup: ["*", "j", "J"], swipe_up: "*", swipe_down: J}
      - {click: k, label: k, long_click: "(", popup: ["(", "k", "K"], swipe_up: "(", swipe_down: K}
      - {click: l, label: l, long_click: ")", popup: [")", "l", "L"], swipe_up: ")", swipe_down: L}
      - {width: 5}
      # 第3行：Shift + z-m + 退格
      - {click: key_shift, long_click: key_capslock, width: 15}
      - {click: z, label: z, long_click: "'", popup: ["'", "z", "Z"], swipe_up: "'", swipe_down: Z}
      - {click: x, label: x, long_click: "/", popup: ["/", "÷", "X", "x"], swipe_up: "/", swipe_down: X}
      - {click: c, label: c, long_click: "-", popup: ["-", "c", "C"], swipe_up: "-", swipe_down: C}
      - {click: v, label: v, long_click: "_", popup: ["_", "v", "V"], swipe_up: "_", swipe_down: V}
      - {click: b, label: b, long_click: ":", popup: [":", "b", "B"], swipe_up: ":", swipe_down: B}
      - {click: n, label: n, long_click: ";", popup: [";", "n", "N"], swipe_up: ";", swipe_down: N}
      - {click: m, label: m, long_click: "?", popup: ["?", "m", "M"], swipe_up: "?", swipe_down: M}
      - {click: key_backspace, swipe_up: key_control_backspace, swipe_down: key_control_z, width: 15}
      # 第4行：功能键
      - {click: to_symbol_liquid_keyboard, width: 15}
      - {click: to_number_keyboard, long_click: VoiceAssist, width: 12}
      - {click: key_comma_en, width: 10}
      - {click: key_space, width: 26}
      - {click: key_period_en, width: 10}
      - {click: switch_en_to_cn, long_click: key_lang_switch, swipe_up: F4, swipe_right: PROG_RED, width: 12}
      - {click: key_return_en, width: 15}

  # ========== 数字键盘（统一，使用 to_lastlock_keyboard 返回） ==========
  number:
    <<: *number_base
    lock: false
    keys:
      - {click: "+", label: "+"}
      - {click: "1", label: "1"}
      - {click: "2", label: "2"}
      - {click: "3", label: "3"}
      - {click: key_backspace, swipe_up: key_control_backspace, swipe_down: key_control_z}
      - {click: "-", label: "-"}
      - {click: "4", label: "4"}
      - {click: "5", label: "5"}
      - {click: "6", label: "6"}
      - {click: ".", label: "."}
      - {click: "@", label: "@"}
      - {click: "7", label: "7"}
      - {click: "8", label: "8"}
      - {click: "9", label: "9"}
      - {click: ":", label: ":"}
      - {click: to_symbol_liquid_keyboard}
      - {click: to_lastlock_keyboard}
      - {click: "0", label: "0"}
      - {click: key_space_num}
      - {click: key_return}

  # ========== 编辑键盘（光标控制） ==========
  edit_keyboard:
    ascii_mode: 0
    author: "hxlh50k"
    name: "编辑键盘"
    width: 20
    height: 59
    lock: false
    keys:
      # Row 1: [返回13.33][↑13.33][空13.33] | 开头 | 粘贴 | 退格
      - {click: to_lastlock_keyboard, width: 13.33}
      - {click: Up, width: 13.33}
      - {width: 13.33}
      - {click: doc_start}
      - {click: paste}
      - {click: key_backspace, swipe_up: key_control_backspace, swipe_down: key_control_z}
      # Row 2: [←13.33][选择13.33][→13.33] | 句首 | 复制 | 剪贴板
      - {click: Left, width: 13.33}
      - {click: select_mode, width: 13.33}
      - {click: Right, width: 13.33}
      - {click: Home}
      - {click: copy}
      - {click: liquid_keyboard_clipboard_from_edit}
      # Row 3: [空13.33][↓13.33][空13.33] | 句尾 | 剪切 | 空格
      - {width: 13.33}
      - {click: Down, width: 13.33}
      - {width: 13.33}
      - {click: End}
      - {click: cut}
      - {click: key_space_num}
      # Row 4: [空40%] | 结尾 | 全选 | 回车
      - {width: 40}
      - {click: doc_end}
      - {click: select_all}
      - {click: key_return}

# ==================== 预设按键 ====================
preset_keys:
  # ========== 系统功能键 ==========
  Hide:
    label: "隐藏"
    send: BACK

  VoidSymbol:
    label: ""

  VoiceAssist:
    label: "⚲"
    send: VOICE_ASSIST

  # ========== 键盘切换键 ==========
  to_number_keyboard:
    label: "123"
    send: Eisu_toggle
    select: number
    functional: true
  # 智能返回键：返回上一个 lock=true 的键盘
  to_lastlock_keyboard:
    label: "◁"
    send: Eisu_toggle
    select: .last_lock
  # 编辑键盘按钮
  to_edit_keyboard:
    label: "编辑"
    send: Eisu_toggle
    select: edit_keyboard

  # ========== 符号键（触发液态符号键盘） ==========
  # 中文键盘/数字键盘(中文)共用
  to_symbol_liquid_keyboard:
    label: "#+="
    functional: true
    send: function
    command: liquid_keyboard
    option: "常用"

  # ========== 返回键（已改用 Keyboard_last_lock） ==========
  # 保留 key_back_base 锚点定义，但不再使用 key_back_to_cn/key_back_to_en

  # ========== 第一行：字母键 ==========
  key_Q:
    label: "Q"
    send: q
  key_WE:
    label: "WE"
    send: w
  key_RT:
    label: "RT"
    send: r
  key_Y:
    label: "Y"
    send: y
  key_U:
    label: "U"
    send: u
  key_IO:
    label: "IO"
    send: i
  key_P:
    label: "P"
    send: p

  # ========== 第二行：字母键 ==========
  key_A:
    label: "A"
    send: a
  key_SD:
    label: "SD"
    send: s
  key_FG:
    label: "FG"
    send: f
  key_H:
    label: "H"
    send: h
  key_JK:
    label: "JK"
    send: j
  key_L:
    label: "L"
    send: l

  # ========== 第三行 ==========
  # 形码引导键：只在输入态（有候选框）时发送功能
  # - 点击: 发送 [ (形码引导)
  # - 上滑: 发送 ' (分词)
  # 非输入态无任何操作（functional: true + composing）
  # 形码引导键（输入态专用）：显示㇕'但发送[
  key_auxiliary:
    label: "㇕'"
    send: "["
    functional: true
  key_fenci:
    label: "词'"
    send: "'"
    functional: true
  key_Z:
    label: "Z"
    send: z
  key_XC:
    label: "XC"
    send: x
  key_V:
    label: "V"
    send: v
  key_BN:
    label: "BN"
    send: b
  key_M:
    label: "M"
    send: m
  key_backspace:
    label: "⌫"
    functional: true
    send: BackSpace
    repeatable: true
  key_control_backspace:
    label: "⌫"
    functional: true
    send: "Control+BackSpace"
    repeatable: true
  key_control_z:
    label: "⌫"
    functional: true
    send: "Control+z"
    repeatable: false

  # ========== 第四行：功能键 ==========
  # ASCII逗号和句号（使用commit直接提交，绕过Rime处理）
  key_ascii_comma:
    label: ","
    commit: ","
  key_ascii_period:
    label: "."
    commit: "."
  # 中文逗号键（点击输出中文逗号，上滑输出英文逗号）
  # 使用左侧填充半角空格来平衡中文标点的左偏显示
  key_comma_cn:
    label: " ，"
    commit: "，"
  # 中文句号键（点击输出中文句号，上滑输出英文句号）
  # 使用左侧填充半角空格来平衡中文标点的左偏显示
  key_period_cn:
    label: " 。"
    commit: "。"
  # 英文逗号键
  key_comma_en:
    label: ","
    commit: ","
  # 英文句号键
  key_period_en:
    label: "."
    commit: "."
  # 切换系统输入法键（长按使用，无显示标签）
  key_lang_switch:
    label: " "
    functional: true
    send: LANGUAGE_SWITCH
  # 切换输入法键（中文键盘用）
  # 点击: 切换EN/中文, 上滑: F4, 长按: 切换系统输入法, 右滑: 皮肤
  switch_cn_to_en:
    label: "⌘"
    functional: true
    select: qwerty26
    send: Eisu_toggle
  # 切换输入法键（英文键盘用）
  # 点击: 切换EN/中文, 上滑: F4, 长按: 切换系统输入法, 右滑: 皮肤
  switch_en_to_cn:
    label: "⌘"
    functional: true
    select: default
    send: Eisu_toggle
  key_space:
    label: "␣"
    send: space
    slide_cursor: true
    repeatable: false
  key_space_num:
    label: "␣"
    send: space
  key_return:
    label: "⤶"
    functional: true
    send: Return

  # ========== 英文键盘专用功能键 ==========
  key_shift:
    label: "⇧"
    functional: true
    send: Shift_L
  key_capslock:
    label: " "
    functional: true
    send: Shift_L
    shift_lock: long
  key_return_en:
    label: "⤶"
    functional: true
    send: Return

  # ========== 液态键盘按键 ==========
  liquid_keyboard_emoji:
    label: "😀"
    send: function
    command: liquid_keyboard
    option: "表情"
  liquid_keyboard_clipboard:
    label: "📋"
    send: function
    command: liquid_keyboard
    option: "剪贴"
  liquid_keyboard_clipboard_from_edit:
    label: "⎘"
    send: function
    command: liquid_keyboard
    option: "剪贴"
  liquid_keyboard_exit:
    label: " ◁ "
    send: function
    command: liquid_keyboard
    option: "-1"
  # 液态键盘固定栏专用按键（与edit_keyboard对齐，使用半角空格填充）
  space1:
    functional: false
    label: " ␣ "
    repeatable: false
    send: space
  Return1:
    label: " \u200A⤶\u200A "
    send: Return
  BackSpace1:
    functional: false
    label: " ⌫ "
    send: BackSpace
    repeatable: true

  # ========== 编辑键盘按键 ==========
  Left:
    functional: false
    label: "←"
    repeatable: true
    send: Left
  Right:
    functional: false
    label: "→"
    repeatable: true
    send: Right
  Up:
    functional: false
    label: "↑"
    send: Up
  Down:
    functional: false
    label: "↓"
    send: Down
  Home:
    functional: false
    label: "行首"
    send: Home
  End:
    functional: false
    label: "行尾"
    send: End
  Tab:
    functional: false
    label: "Tab"
    send: Tab
  select_all:
    functional: false
    label: "全选"
    send: "Control+a"
  copy:
    functional: false
    label: "复制"
    send: "Control+c"
  paste:
    functional: false
    label: "粘贴"
    send: "Control+v"
  cut:
    functional: false
    label: "剪切"
    send: "Control+x"
  undo:
    functional: false
    label: "撤销"
    send: "Control+z"
  redo:
    functional: false
    label: "重做"
    send: "Control+Shift+z"
  doc_start:
    functional: false
    label: "开头"
    send: "Control+Home"
  doc_end:
    functional: false
    label: "结尾"
    send: "Control+End"
  select_mode:
    functional: false
    label: "选择"
    send: Shift_L

