# 样式配置
style:
  auto_caps: false
  candidate_font: han.ttf
  candidate_padding: 5
  candidate_spacing: 0.5
  candidate_text_size: 18
  candidate_use_cursor: true
  candidate_view_height: 28
  color_scheme: default
  comment_font: comment.ttf
  comment_height: 14
  comment_on_top: true
  comment_text_size: 12
  enter_label_mode: 0
  hanb_font: hanb.ttf
  horizontal: true
  horizontal_gap: 12
  key_font: latin.ttf
  key_height: 59
  key_long_text_size: 20
  key_text_size: 20
  key_width: 10.0
  keyboard_padding_bottom: 20
  keyboard_height: 248
  keyboard_height_land: 203
