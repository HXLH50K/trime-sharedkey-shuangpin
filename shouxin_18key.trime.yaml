# 候选区工具栏配置
tool_bar:
  button_font: iconfont.ttf
  button_spacing: 5
  buttons:
    - {action: Hide, foreground: {style: "ic@keyboard_close"}}
    - {action: liquid_keyboard_emoji, foreground: {style: "ic@emoticon"}}
    - {action: liquid_keyboard_clipboard, foreground: {style: "ic@clipboard"}}
    # 编辑按钮：进入edit_keyboard
    - {action: to_edit_keyboard, foreground: {style: "ic@cursor_text"}}
    # 键盘按钮：返回上一个lock键盘
    - {action: to_lastlock_keyboard, foreground: {style: "ic@keyboard"}}

# 候选窗口配置
window:
  foreground:
    comment_font_size: 16
    label_font_size: 20
    text_font_size: 20
  insets:
    horizontal: 4
    vertical: 4
  item_padding:
    horizontal: 4

